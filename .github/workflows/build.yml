name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'latest_version.txt' ]
    tags: [ 'v*', '[0-9]*-*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "Android SDK licenses accepted at $ANDROID_HOME"

      - name: Setup signing keystore
        env:
          DRS_KEYSTORE_B64: ${{ secrets.DRS_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          if [ -n "$DRS_KEYSTORE_B64" ]; then
            echo "$DRS_KEYSTORE_B64" | base64 -d > keystore/devicereset-release.keystore
            echo "Decoded keystore from repository secret"
          else
            echo "No secret keystore provided, generating release keystore on the fly..."
            keytool -genkeypair -v -keystore keystore/devicereset-release.keystore -alias devicereset \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "DRS_Key_2026!" -keypass "DRS_Key_2026!" \
              -dname "CN=DeviceResetSpoofer, OU=Mobile, O=DRS, L=Unknown, ST=Unknown, C=US"
          fi
          echo "DRS_KEYSTORE_PATH=keystore/devicereset-release.keystore" >> "$GITHUB_ENV"
          echo "DRS_KEYSTORE_PASS=DRS_Key_2026!" >> "$GITHUB_ENV"
          ls -la keystore/devicereset-release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature & 16KB alignment
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          echo "SIGNATURE OK"
          
          # 16KB 页兼容：arm64 库 LOAD 段必须 0x4000 对齐
          READELF="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p /tmp/apk16 && unzip -o -q app/build/outputs/apk/release/app-release.apk "lib/arm64-v8a/*.so" -d /tmp/apk16
          FAIL=0
          for lib in /tmp/apk16/lib/arm64-v8a/*.so; do
            ALIGN=$($READELF -l "$lib" | awk '/LOAD/{print $NF; exit}')
            echo "$(basename "$lib"): LOAD对齐=$ALIGN"
            [ "$ALIGN" = "0x4000" ] || FAIL=1
          done
          [ $FAIL -eq 0 ] && echo "16KB ALIGNMENT OK" || { echo "16KB ALIGNMENT FAIL"; exit 1; }

      - name: Update latest_version.txt
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "Current version: $VER"
          if [ -f latest_version.txt ] && [ "$(cat latest_version.txt)" = "$VER" ]; then
            echo "Version file is up to date"
          else
            echo "$VER" > latest_version.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest_version.txt
            git commit -m "Auto-update latest_version.txt to $VER" || true
            git push origin main || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceResetSpoofer-v4.8.0-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Package Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./DeviceResetSpoofer-v4.8.0-release.apk
          ls -la DeviceResetSpoofer-v4.8.0-release.apk

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8.0
          name: DeviceReset Spoofer v4.8.0
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DeviceResetSpoofer-v4.8.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
